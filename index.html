
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050816">
  <title>NearShare</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #050816;
      --muted: #91acd2;
      --cyan: #00d9ff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 14px;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(ellipse at 50% 0%, #10366e 0%, transparent 45%),
        var(--bg);
    }

    .app {
      max-width: 580px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 22px 10px 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(30px, 7vw, 42px);
      font-weight: 800;
      letter-spacing: -1.5px;
    }

    .brand-mark {
      color: var(--cyan);
      text-shadow: 0 0 22px #00aaff;
    }

    .brand span:last-child {
      background: linear-gradient(90deg, #fff, #36aaff);
      color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: var(--muted);
      margin: 9px 0 0;
      font-size: 14px;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 12px;
      margin-bottom: 18px;
      border: 1px solid #174b78;
      border-radius: 15px;
      background: #091a30;
      color: #9cecff;
      font-size: 13px;
    }

    .dot {
      width: 8px;
      height: 8px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #32edaa;
      box-shadow: 0 0 12px #32edaa;
    }

    .panel {
      padding: 19px;
      margin-bottom: 17px;
      border: 1px solid #164b85;
      border-radius: 23px;
      background: linear-gradient(145deg, #0b1931ee, #060c1bee);
      box-shadow: 0 0 28px #007bff12;
    }

    h2 {
      margin: 0 0 8px;
      font-size: 19px;
    }

    .description {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 16px;
    }

    .social {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 13px;
      margin: 12px 0;
      border: 1px solid #15529a;
      border-radius: 17px;
      background: #07142a;
      transition: 0.2s;
    }

    .social:focus-within {
      border-color: #20aaff;
      box-shadow: 0 0 17px #087bff26;
    }

    .social.telegram {
      border-color: #087eaa;
      background: linear-gradient(110deg, #06263d, #07142a 70%);
    }

    .social.instagram {
      border-color: #8e348e;
      background: linear-gradient(110deg, #30102f, #10122c 75%);
    }

    .icon-box {
      width: 57px;
      height: 57px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      border-radius: 17px;
      color: white;
      background: linear-gradient(145deg, #08b9ff, #0755ed);
      box-shadow: 0 0 20px #087bff42;
    }

    .telegram .icon-box {
      background: linear-gradient(145deg, #00d9f5, #0878ee);
    }

    .instagram .icon-box {
      background: linear-gradient(135deg, #7c35f5, #ff2588, #ffad36);
    }

    .icon-box svg {
      width: 30px;
      height: 30px;
    }

    .field {
      min-width: 0;
      flex: 1;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 15px;
    }

    .field input {
      display: block;
      width: 100%;
      min-width: 0;
      padding: 12px;
      color: white;
      font-size: 14px;
      border: 1px solid #244d7b;
      border-radius: 11px;
      background: #030a18;
      outline: none;
    }

    .field input:focus {
      border-color: #1ab8ff;
      box-shadow: 0 0 10px #087bff28;
    }

    .field input::placeholder {
      color: #7187a9;
    }

    .share-inline {
      width: 42px;
      min-width: 42px;
      height: 42px;
      min-height: 42px;
      margin: 20px 0 0;
      padding: 0;
      border: 1px solid #267ac4;
      border-radius: 12px;
      color: #b9f3ff;
      font-size: 22px;
      background: linear-gradient(145deg, #0d4e85, #092548);
      cursor: pointer;
    }

    .share-inline:hover {
      filter: brightness(1.2);
      border-color: var(--cyan);
    }

    .hint {
      color: #8299bb;
      font-size: 12px;
      line-height: 1.6;
    }

    button {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 47px;
      margin-top: 11px;
      padding: 13px;
      border: 1px solid #235187;
      border-radius: 13px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: #0b1a32;
    }

    button:hover {
      filter: brightness(1.12);
    }

    footer {
      text-align: center;
      padding: 13px 0 22px;
      color: #637da4;
      font-size: 12px;
    }

    @media (max-width: 380px) {
      .panel {
        padding: 14px;
      }

      .social {
        gap: 9px;
        padding: 9px;
      }

      .icon-box {
        width: 45px;
        height: 45px;
        border-radius: 13px;
      }

      .icon-box svg {
        width: 25px;
        height: 25px;
      }

      .field input {
        padding: 10px 8px;
        font-size: 13px;
      }

      .share-inline {
        width: 36px;
        min-width: 36px;
        height: 38px;
        min-height: 38px;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="header">
      <div class="brand">
        <span class="brand-mark">✦</span>
        <span>NearShare</span>
      </div>
      <p class="subtitle">Yaqinlash. Ulash. Bog‘lan.</p>
    </header>

    <div class="status">
      <span class="dot"></span>
      <span>Ma’lumotlaringiz avtomatik saqlanadi</span>
    </div>

    <section class="panel">
      <h2>👤 Mening kontaktlarim</h2>

      <p class="description">
        Kerakli ma’lumotlarni kiriting. Maydon yonidagi ↗
        belgisini bossangiz, to‘ldirilgan barcha ma’lumotlar
        birgalikda ulashiladi.
      </p>

      <!-- TELEFON -->
      <div class="social">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round">
            <path d="M6 3h3l2 5-2 1.5a15 15 0 0 0 5.5 5.5L16 13l5 2v3a2 2 0 0 1-2 2A17 17 0 0 1 4 5a2 2 0 0 1 2-2z"/>
          </svg>
        </div>

        <div class="field">
          <label for="telefon">Telefon</label>
          <input id="telefon" type="tel"
                 placeholder="+998 90 123 45 67"
                 autocomplete="tel">
        </div>

        <button class="share-inline" type="button"
                aria-label="Ma’lumotlarni ulashish"
                title="To‘ldirilgan ma’lumotlarni ulashish"
                onclick="shareAll()">↗</button>
      </div>

      <!-- TELEGRAM -->
      <div class="social telegram">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="currentColor"
               aria-hidden="true">
            <path d="M21.7 3.3a1.4 1.4 0 0 0-1.5-.2L2.8 9.7c-1.2.5-1.1 1.7.1 2.1l4.4 1.4 1.7 5.2c.3.8.9 1 1.5.3l2.5-2.5 4.6 3.4c.8.5 1.5.1 1.7-.8l3.1-13.9c.2-.7 0-1.2-.7-1.6ZM9 12.8l8.7-5.5-6.8 6.8-.3 3.1L9 12.8Z"/>
          </svg>
        </div>

        <div class="field">
          <label for="telegram">Telegram</label>
          <input id="telegram"
                 placeholder="@username yoki havola">
        </div>

        <button class="share-inline" type="button"
                aria-label="Ma’lumotlarni ulashish"
                title="To‘ldirilgan ma’lumotlarni ulashish"
                onclick="shareAll()">↗</button>
      </div>

      <!-- INSTAGRAM -->
      <div class="social instagram">
        <div class="icon-box">
          <svg viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1"
                    fill="currentColor" stroke="none"/>
          </svg>
        </div>

        <div class="field">
          <label for="instagram">Instagram</label>
          <input id="instagram"
                 placeholder="@username yoki havola">
        </div>

        <button class="share-inline" type="button"
                aria-label="Ma’lumotlarni ulashish"
                title="To‘ldirilgan ma’lumotlarni ulashish"
                onclick="shareAll()">↗</button>
      </div>

      <p class="hint" id="saveStatus" aria-live="polite">
        Ma’lumotlar shu brauzerda avtomatik saqlanadi.
      </p>

      <button type="button" onclick="clearProfile()">
        Ma’lumotlarni o‘chirish
      </button>
    </section>

    <footer>NearShare © 2026</footer>
  </main>

  <script>
    const ids = ["telefon", "telegram", "instagram"];
    const $ = id => document.getElementById(id);
    const storageKey = "nearshare_profile";

    function getData() {
      return {
        telefon: $("telefon").value.trim(),
        telegram: $("telegram").value.trim(),
        instagram: $("instagram").value.trim()
      };
    }

    function profileURL(type, value) {
      if (!value) return "";

      if (/^https?:\/\//i.test(value)) {
        return value;
      }

      const username = value
        .replace(/^@/, "")
        .replace(/^\/+/, "");

      if (type === "telegram") {
        return "https://t.me/" + username;
      }

      if (type === "instagram") {
        return "https://www.instagram.com/" + username + "/";
      }

      return "";
    }

    // Ma’lumotlar shu brauzerda avtomatik saqlanadi.
    function saveData() {
      try {
        localStorage.setItem(
          storageKey,
          JSON.stringify(getData())
        );

        $("saveStatus").textContent =
          "✓ Saqlandi. Keyingi safar ham shu ma’lumotlar chiqadi.";
      } catch (error) {
        $("saveStatus").textContent =
          "Saqlash amalga oshmadi. Brauzer sozlamalarini tekshiring.";
      }
    }

    // Faqat to‘ldirilgan maydonlarni birga ulashadi.
    async function shareAll() {
      const d = getData();
      const parts = [];

      if (d.telefon) {
        parts.push("Telefon: " + d.telefon);
      }

      if (d.telegram) {
        parts.push(
          "Telegram: " + profileURL("telegram", d.telegram)
        );
      }

      if (d.instagram) {
        parts.push(
          "Instagram: " + profileURL("instagram", d.instagram)
        );
      }

      if (parts.length === 0) {
        alert(
          "Avval Telefon, Telegram yoki Instagram maydoniga ma’lumot kiriting."
        );
        return;
      }

      const text =
        "NearShare — kontakt ma’lumotlari\n\n" +
        parts.join("\n");

      if (navigator.share) {
        try {
          await navigator.share({
            title: "NearShare kontaktlari",
            text: text
          });
        } catch (error) {
          if (error.name !== "AbortError") {
            alert("Ulashish amalga oshmadi. Qaytadan urinib ko‘ring.");
          }
        }
      } else {
        try {
          await navigator.clipboard.writeText(text);
          alert(
            "Ma’lumotlar nusxalandi. Endi kerakli odamga yuboring."
          );
        } catch (error) {
          window.prompt(
            "Ma’lumotlarni nusxalab, kerakli odamga yuboring:",
            text
          );
        }
      }
    }

    // Oldin saqlangan ma’lumotlarni tiklash.
    function restoreData() {
      try {
        const saved = JSON.parse(
          localStorage.getItem(storageKey) || "{}"
        );

        ids.forEach(id => {
          if (typeof saved[id] === "string") {
            $(id).value = saved[id];
          }
        });

        const hasData = ids.some(
          id => $(id).value.trim() !== ""
        );

        $("saveStatus").textContent = hasData
          ? "✓ Oldingi ma’lumotlaringiz tiklandi."
          : "Ma’lumotlarni kiriting — avtomatik saqlanadi.";

      } catch (error) {
        $("saveStatus").textContent =
          "Saqlangan ma’lumotlarni o‘qib bo‘lmadi.";
      }
    }

    // Profil ma’lumotlarini o‘chirish.
    function clearProfile() {
      if (!confirm("Saqlangan ma’lumotlarni o‘chirasizmi?")) {
        return;
      }

      ids.forEach(id => {
        $(id).value = "";
      });

      localStorage.removeItem(storageKey);

      $("saveStatus").textContent = "Ma’lumotlar o‘chirildi.";
    }

    ids.forEach(id => {
      $(id).addEventListener("input", saveData);
    });

    restoreData();
  </script>
</body>
</html>
